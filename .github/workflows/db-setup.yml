name: Database setup

# Runs all migrations + seed against your Supabase database.
# Trigger manually from the Actions tab (safer than on every push, since the
# raw migrations are not re-runnable — for incremental auto-migration on deploy
# use the Supabase CLI `supabase db push`, which tracks applied migrations).
on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply migrations + seed
        env:
          # DATABASE_URL must be the POSTGRES CONNECTION STRING, not the API URL.
          #   ✗ https://<ref>.supabase.co               (this is the API URL)
          #   ✓ postgresql://postgres:<PW>@db.<ref>.supabase.co:5432/postgres
          # Get it from: Supabase → Project Settings → Database → Connection string (URI).
          # Store it as a secret (it contains your DB password) — never hardcode it here:
          #   Repo → Settings → Secrets and variables → Actions → New secret → SUPABASE_DB_URL
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: bash scripts/db-setup.sh
